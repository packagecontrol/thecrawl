name: Crawl Libraries

concurrency:
  group: crawl-pipeline
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl_libraries:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: crawler-status
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Restore library cache
        uses: actions/cache@v4
        with:
          path: |
            .pypi-cache
            libraries.json
            registry.json
          key: lib-cache-${{ github.run_id }}
          fail-on-cache-miss: false
          restore-keys: |
            lib-cache-

      - name: Generate registry
        run: >
          uv run -m scripts.generate_registry
          --channel https://raw.githubusercontent.com/packagecontrol/channel/refs/heads/main/repository.json

      - name: Run library crawler
        run: uv run -m scripts.crawl_libraries --workspace libraries.json --limit 150

      - name: Update release assets
        run: |
          gh release view ${{ env.RELEASE_TAG }} > /dev/null
          gh release upload ${{ env.RELEASE_TAG }} libraries.json --clobber

      - name: Upload libraries backup
        id: libraries-backup-step
        uses: actions/upload-artifact@v4
        with:
          name: libraries-backup
          path: |
            libraries.json
            registry.json
          retention-days: 30
