name: Rebuild on push to gh-pages

on:
  workflow_dispatch:
  push:
    branches: ["gh-pages"]
  pull_request:
    branches: ["gh-pages"]

permissions:
  contents: read

jobs:
  lint-and-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore rendered README cache
        uses: actions/cache@v5
        with:
          path: readmes_rendered.json
          key: readmes-rendered-${{ github.run_id }}
          restore-keys: |
            readmes-rendered-

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  trigger-website-deploy:
    if: ${{ github.event_name == 'push' }}
    needs: lint-and-test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website deployment
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/packagecontrol/website-stage/actions/workflows/deploy.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${SITE_DEPLOY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"ref\":\"main\",\"inputs\":{\"source_ref\":\"${GITHUB_SHA}\"}}"
