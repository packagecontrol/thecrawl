[project]
name = "the-crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.4",
    "inflect>=7.5.0",
    "packaging>=24.2",
    "readchar>=4.2.1",
    "rich>=13.7",
    "tzdata; platform_system == 'Windows'",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "E731", # Allow assigning lambda expressions to variables
]
extend-select = [
    "E",
]
