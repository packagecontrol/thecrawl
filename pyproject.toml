[project]
name = "the-crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11.18",
    "packaging>=24.2",
    "rich>=13.7",
    "tzdata; platform_system == 'Windows'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "E731", # Allow assigning lambda expressions to variables
]
extend-select = [
    "E",
]
